syntax = "LuaJIT"
column_width = 80
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "FunctionOnly"
space_after_function_names = "Never"
block_newline_gaps = "Never"

[sort_requires]
enabled = false
